<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognia Case Study: Full Figma View</title>
    <!-- Load Tailwind CSS for easy responsiveness and styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            /* Ensures no extra margin/padding around the edge of the image */
            margin: 0;
            padding: 0;
            background-color: #f7f9fc;
            font-family: 'Inter', sans-serif;
        }
        /* Makes sure the image container is fluid */
        #case-study-display {
            width: 100%;
            height: auto;
        }
        .iframe-container {
            position: relative;
            /* Aspect ratio 16:9 (9 / 16 * 100) or 75% for taller prototype */
            padding-bottom: 75%; 
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="w-full mx-auto">
        
        <header class="bg-white shadow-md p-4 sticky top-0 z-10 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-700">Cognia: Full Case Study</h1>
            <!-- NOTE: You would replace # with the URL of your main portfolio page -->
            <a href="index.html" class="px-4 py-2 bg-indigo-500 text-white text-sm font-semibold rounded-lg hover:bg-indigo-600 transition duration-300 shadow-lg">
                &larr; Back to Portfolio
            </a>
        </header>

        <!-- Main Content Area: The Case Study Image -->
        <main id="case-study-display" class="pt-4 pb-12">
            
            <img 
                src="image/case study1.png"
                alt="Full UX Case Study for Cognia, showing research, wireframes, and final mockups." 
                class="w-full h-auto block mx-auto shadow-xl"
                onerror="handleImageError(this)"
            >
            
            <p id="image-error-message" class="hidden text-center text-red-600 p-4 mt-4 bg-red-100 rounded-lg max-w-lg mx-auto">
                **Error:** The case study image failed to load. Please **replace the 'src' URL in the code** with the public link to your hosted Figma image.
            </p>
            <div class="iframe-container">
                <iframe 
                    style="border: 1px solid rgba(0, 0, 0, 0.1);" 
                    src="https://embed.figma.com/proto/7j7RM2tJILIvciWz6sgOWO/Trackle-File?page-id=0%3A1&node-id=1672-4&viewport=378%2C162%2C0.08&scaling=contain&content-scaling=fixed&starting-point-node-id=1752%3A44&embed-host=share" 
                    allowfullscreen
                    title="Cognia Interactive Figma Prototype">
                </iframe>
            </div>
        </main>
    </div>
    <script>
        // Function to handle image loading errors gracefully
        function handleImageError(imageElement) {
            imageElement.style.display = 'none'; // Hide the broken image icon
            document.getElementById('image-error-message').classList.remove('hidden'); // Show the custom error message
            console.error("Failed to load the case study image. Please check the 'src' URL.");
        }
    </script>
<footer id="contact" class="py-10 text-center border-t border-gray-200 mt-16">
            <p class="text-sm text-gray-500">
                &copy; 2025 Sanjana Malipatil. | Built with Tailwind CSS.
            </p>
        </footer>
</body>

</html>
