<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjana Malipatil - UX/UI Designer</title>
    <!-- Load Tailwind CSS for utility-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Custom styles to match the minimalist, high-contrast aesthetic */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F9FB; /* Very light background for contrast */
            color: #1F2937; /* Dark gray text */
        }
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            background-color: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* Subtle card-like shadow for the page */
            min-height: 95vh;
            border-radius: 16px;
        }
        /* Navigation links */
        .nav-link {
            font-weight: 500;
            color: #374151;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: #000000;
        }
		 #case-study-display {
            width: 100%;
            height: auto;
        }
	</style>
</head>
<body>
    <div class="main-container">

        <!-- 1. Navigation Header -->
        <header class="flex justify-between items-center py-4 px-2 mb-16">
            <h1 class="text-2xl font-extrabold tracking-tight">
                SM
            </h1>
            <nav class="space-x-8">
                <a href= "Homepage.html" class="nav-link">Work</a>
                <a href="https://docs.google.com/document/d/18IwRmgn8KNzml3Gf54eGQ0ZjYRK2iguFsDmBcUD-wC0/edit?usp=sharing" target="_blank" class="nav-link">Resume</a>
                <a href="about.html" class="nav-link text-black font-semibold"><u>About</u></a>
            </nav>
        </header>
		<main id="case-study-display" class="pt-4 pb-12">
            <!-- 
                FIXED: Replaced the local file reference ('image_a45e52.png') with a public placeholder URL 
                to ensure the page loads correctly.
                
                ACTION NEEDED: Replace the 'src' attribute below with the public URL 
                of your hosted Figma image (e.g., from Imgur, Dropbox, or your web server).
            -->
            <img 
                src="C:\Users\sanja\Downloads\About.png"
                alt="About" 
                class="w-full h-auto block mx-auto"
                onerror="handleImageError(this)"
            >
            
            <p id="image-error-message" class="hidden text-center text-red-600 p-4 mt-4 bg-red-100 rounded-lg max-w-lg mx-auto">
                **Error:** The case study image failed to load. Please **replace the 'src' URL in the code** with the public link to your hosted Figma image.
            </p>
        </main>
	</div>
	    <script>
        // Function to handle image loading errors gracefully
        function handleImageError(imageElement) {
            imageElement.style.display = 'none'; // Hide the broken image icon
            document.getElementById('image-error-message').classList.remove('hidden'); // Show the custom error message
            console.error("Failed to load the case study image. Please check the 'src' URL.");
        }
    </script>
	<footer id="contact" class="py-10 text-center border-t border-gray-200 mt-16">

    </footer>
